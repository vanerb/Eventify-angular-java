<app-container>
  <main class="profile-page">
    <section class="profile-hero">
      <div class="profile-cover"><img [src]="getImage(user?.banner?.url)" alt="Portada del perfil"><div class="profile-cover-shade"></div><button (click)="updateProfile()" class="profile-settings" aria-label="Editar perfil"><i class="bi bi-pencil"></i><span>Editar perfil</span></button></div>
      <div class="profile-identity">
        <img class="profile-avatar" [src]="getImage(user?.image?.url)" [alt]="user.name">
        <div class="profile-name"><h1>{{ user.name }}</h1><span>{{ '@' + user.username }}</span></div>
      </div>
      <p *ngIf="user.bio" class="profile-bio">{{ user.bio }}</p>
      <div class="profile-meta"><span><i class="bi bi-stars"></i> Parte de la comunidad Eventify</span></div>
    </section>

    <section class="profile-content">
      <mat-tab-group class="profile-tabs">
        <mat-tab label="Mis publicaciones"><app-posts [view]="'my'"></app-posts></mat-tab>
        <mat-tab label="Mis eventos"><app-events [view]="'my'"></app-events></mat-tab>
      </mat-tab-group>
    </section>
  </main>
</app-container>
